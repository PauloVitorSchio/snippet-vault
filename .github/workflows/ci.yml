name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: snippet_vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d snippet_vault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: django-insecure-ci-not-for-production
      POSTGRES_DB: snippet_vault_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync environment
        run: uv sync --locked --all-groups

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Bandit
        run: uv run bandit -r . -c pyproject.toml

      - name: Safety (dependency scan)
        run: |
          uv export --frozen --format requirements-txt --all-groups -o /tmp/requirements-all.txt
          uv run safety check -r /tmp/requirements-all.txt --short-report -i 51358
        # 51358: advisory targets the safety package itself when it appears in scanned dev deps.

      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
